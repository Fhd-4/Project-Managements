<div class="login-container" [dir]="isRtl ? 'rtl' : 'ltr'">
  <!-- Left panel: static security info matching Figma -->
  <div class="left-panel">
    <div class="logo">PS</div>
    <div class="slide-content">
      <img src="assets/security.jpg" alt="Security Lock" class="slide-image">
      <h2>Enterprise Grade Security</h2>
      <p>Protect sensitive project data with secure access, verification, and permission based control.</p>
    </div>
    <!-- Placeholder spacing matching layout -->
    <div style="height: 14px;"></div>
  </div>

  <!-- Right panel: form steps -->
  <div class="right-panel">
    <!-- Navigation Back Button -->
    <div class="back-button" (click)="goBack()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </div>

    <!-- Language Selector with custom globe-chat-bubbles icon -->
    <div class="lang-selector" (click)="changeLang()">
      <span>{{t.langLabel}}</span>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="globe-icon">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M3.6 9h16.8M3.6 15h16.8"></path>
        <path d="M11.5 3a17 17 0 0 0 0 18M12.5 3a17 17 0 0 1 0 18"></path>
        <!-- Speech bubble on left -->
        <rect x="2" y="8" width="5" height="4" rx="1.2" fill="white" stroke="currentColor" stroke-width="1.2"></rect>
        <path d="M4 12l-1 1v-1" stroke="currentColor" stroke-width="1.2"></path>
        <!-- Speech bubble on right -->
        <rect x="17" y="12" width="5" height="4" rx="1.2" fill="white" stroke="currentColor" stroke-width="1.2"></rect>
        <path d="M20 16l1 1v-1" stroke="currentColor" stroke-width="1.2"></path>
      </svg>
    </div>

    <!-- Form Container -->
    <div class="form-container">
      <h1 class="login-title">{{t.title}}</h1>
      <p class="subtitle">{{t.subtitle}}</p>

      <form (ngSubmit)="onSubmit()">
        <!-- Phone (Read-Only) -->
        <div class="input-group">
          <label>{{t.phoneLabel}}</label>
          <div class="input-wrapper disabled-wrapper" dir="ltr">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6c757d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="icon">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
            <input type="text" name="phone" [ngModel]="phone" readonly class="phone-input disabled-input" style="color: #6c757d; font-weight: bold; background: transparent; border: none; outline: none; width: 100%; padding-left: 10px;">
          </div>
        </div>

        <!-- Current Password -->
        <div class="input-group">
          <label>{{t.currentPasswordLabel}}</label>
          <div class="input-wrapper">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6c757d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="icon">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input [type]="isCurrentPasswordHidden ? 'password' : 'text'" name="currentPassword" [(ngModel)]="currentPassword" required class="password-input">
            <span class="visibility-toggle" (click)="togglePasswordVisibility('current')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" *ngIf="isCurrentPasswordHidden">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" *ngIf="!isCurrentPasswordHidden">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </span>
          </div>
        </div>

        <!-- New Password -->
        <div class="input-group">
          <label>{{t.newPasswordLabel}}</label>
          <div class="input-wrapper">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6c757d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="icon">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input [type]="isNewPasswordHidden ? 'password' : 'text'" name="newPassword" [(ngModel)]="newPassword" required class="password-input">
            <span class="visibility-toggle" (click)="togglePasswordVisibility('new')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" *ngIf="isNewPasswordHidden">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" *ngIf="!isNewPasswordHidden">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </span>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="input-group">
          <label>{{t.confirmPasswordLabel}}</label>
          <div class="input-wrapper">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6c757d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="icon">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input [type]="isConfirmPasswordHidden ? 'password' : 'text'" name="confirmPassword" [(ngModel)]="confirmPassword" required class="password-input">
            <span class="visibility-toggle" (click)="togglePasswordVisibility('confirm')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" *ngIf="isConfirmPasswordHidden">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" *ngIf="!isConfirmPasswordHidden">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </span>
          </div>
        </div>

        <p class="error-message" *ngIf="errorMessage">{{errorMessage}}</p>
        <p class="success-message" *ngIf="successMessage">{{successMessage}}</p>

        <button type="submit" [disabled]="isLoading" style="margin-top: 24px;">
          {{ isLoading ? t.savingBtn : t.saveBtn }}
          <span class="btn-arrow" *ngIf="!isLoading">→</span>
        </button>
      </form>
    </div>
  </div>
</div>
