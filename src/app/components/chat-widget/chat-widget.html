<!-- الأيقونة العائمة أسفل اليمين -->
<div class="chat-fab" (click)="toggleChat()" *ngIf="!isOpen">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
  </svg>
</div>

<!-- نافذة المحادثة المنبثقة -->
<div class="chat-popup-container" *ngIf="isOpen">
  
  <!-- رأس النافذة -->
  <div class="chat-header">
    <div class="back-btn" (click)="toggleChat()">‹</div>
    <div class="chat-title">PMO Team Support</div>
    <div class="avatar-container">
      <div class="plain-avatar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
    </div>
    <div class="chat-subtitle">We will reply as soon as we can</div>
    <div class="chat-sub-desc">Ask about project status, tasks, or share feedback.</div>
  </div>

  <!-- صندوق عرض الرسائل -->
  <div class="chat-body" #scrollContainer>
    <div class="date-badge">Today</div>

    <!-- حلقة عرض الرسائل الحية -->
    <div *ngFor="let msg of messages; let i = index" 
         class="message-row" 
         [ngClass]="{'incoming': msg.isIncoming, 'outgoing': !msg.isIncoming}"
         (mouseenter)="hoveredMessageIndex = i"
         (mouseleave)="hoveredMessageIndex = null">
      
      <!-- شريط التفاعلات العائم عند التمرير على الرسالة (WhatsApp Reaction Strip) -->
      <div class="reaction-strip" *ngIf="hoveredMessageIndex === i">
        <button type="button" 
                *ngFor="let emoji of emojiList" 
                (click)="toggleReaction(msg, emoji)" 
                class="reaction-btn">
          {{ emoji }}
        </button>
      </div>

      <div class="message-avatar" *ngIf="msg.isIncoming">
        <div class="plain-avatar small">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
      </div>

      <div class="message-wrapper">
        <span class="message-sender">{{ msg.user === currentUser ? 'You' : msg.user }}</span>
        <div class="message-bubble">
          {{ msg.message }}

          <!-- وسم التفاعلات أسفل الرسالة -->
          <div class="reactions-badge" *ngIf="msg.reactions && msg.reactions.length > 0">
            <span *ngFor="let r of msg.reactions" class="reaction-pill">
              {{ r.emoji }} <small *ngIf="r.count > 1">{{ r.count }}</small>
            </span>
          </div>
        </div>
      </div>
    </div>

    <!-- مؤشر الكتابة الجماعي الحية -->
    <div class="typing-indicator-row" *ngIf="typingUsers.size > 0">
      <div class="typing-bubble">
        <span class="typing-text">{{ getTypingText() }}</span>
        <div class="dots-container">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    </div>

    <div class="quick-options" *ngIf="messages.length <= 1">
      <button class="option-pill" (click)="sendQuickMessage('Check project milestones!')">Check project milestones!</button>
      <button class="option-pill" (click)="sendQuickMessage('Talk to project manager!')">Talk to project manager!</button>
    </div>
  </div>

  <!-- شريط اختيار الإيموجي المنبثق فوق حقل الإدخال -->
  <div class="input-emoji-strip" *ngIf="showInputEmojiStrip">
    <button type="button" 
            *ngFor="let emoji of emojiList" 
            (click)="insertEmoji(emoji)" 
            class="emoji-item">
      {{ emoji }}
    </button>
  </div>

  <!-- شريط الإدخال السفلي -->
  <div class="chat-footer">
    <button class="attach-btn" type="button" title="Attach file">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
      </svg>
    </button>

    <!-- زر الإيموشن بجوار المشبك -->
    <button class="emoji-toggle-btn" type="button" (click)="showInputEmojiStrip = !showInputEmojiStrip" title="Add emoji">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
        <line x1="9" y1="9" x2="9.01" y2="9"></line>
        <line x1="15" y1="9" x2="15.01" y2="9"></line>
      </svg>
    </button>
    
    <input 
      type="text" 
      [(ngModel)]="newMessage" 
      (input)="onInputChange()" 
      (keyup.enter)="sendMessage()" 
      placeholder="Type your message here..." 
    />
    
    <button class="send-btn" type="button" (click)="sendMessage()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

</div>

<!-- زر الإغلاق العائم عند فتح الشات -->
<div class="chat-fab close-fab" (click)="toggleChat()" *ngIf="isOpen">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="18" y1="6" x2="6" y2="18"></line>
    <line x1="6" y1="6" x2="18" y2="18"></line>
  </svg>
</div>
