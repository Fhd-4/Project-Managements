<div class="portfolios-container" [dir]="isRtl ? 'rtl' : 'ltr'">
  <div class="create-header">
    <button class="back-btn" (click)="goBack()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </button>
    <div class="header-titles">
      <h2>{{ isRtl ? 'إنشاء خطة' : 'Create Plan' }}</h2>
      <span class="breadcrumb">Plans / {{ isRtl ? 'إنشاء خطة' : 'Create Plan' }}</span>
    </div>
  </div>

  <div class="create-page-card">
    <div class="create-portfolio-form">
      <div class="form-grid">
        <div class="form-field-group">
          <label>{{ isRtl ? 'اسم الخطة' : 'Plan Name' }}</label>
          <input type="text" [(ngModel)]="planName" [placeholder]="isRtl ? 'اكتب هنا' : 'Write Here'">
        </div>
        <div class="form-field-group">
          <label>{{ isRtl ? 'المشروع' : 'Project' }}</label>
          <div class="select-wrapper">
            <select [(ngModel)]="projectId">
              <option *ngFor="let proj of projects" [value]="proj.id">{{ proj.name }}</option>
            </select>
            <svg class="select-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>
      </div>

      <div class="form-full-field">
        <label>{{ isRtl ? 'الوصف' : 'Description' }}</label>
        <textarea rows="4" [(ngModel)]="description" [placeholder]="isRtl ? 'اكتب هنا' : 'Write Here'"></textarea>
      </div>

      <div class="form-grid">
        <div class="form-field-group">
          <label>{{ isRtl ? 'تاريخ البدء' : 'Start Date' }}</label>
          <input type="date" [(ngModel)]="startDate">
        </div>
        <div class="form-field-group">
          <label>{{ isRtl ? 'تاريخ الانتهاء' : 'End Date' }}</label>
          <input type="date" [(ngModel)]="endDate">
        </div>
      </div>

      <!-- Dynamic Milestones -->
      <div class="nested-block-section" *ngFor="let item of milestones; let i = index">
        <div class="block-header">
          <span>{{ isRtl ? 'المرحلة' : 'Milestone' }} {{ i + 1 }}</span>
          <button class="delete-item-btn" (click)="removeMilestone(i)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
        </div>
        <div class="form-grid">
          <div class="form-field-group">
            <label>{{ isRtl ? 'اسم المرحلة' : 'Milestone Name' }}</label>
            <input type="text" [(ngModel)]="item.name" [placeholder]="isRtl ? 'اكتب هنا' : 'Write Here'">
          </div>
          <div class="form-field-group">
            <label>{{ isRtl ? 'التاريخ المستهدف' : 'Target Date' }}</label>
            <input type="date" [(ngModel)]="item.targetDate">
          </div>
        </div>
      </div>
      <button class="add-item-btn" (click)="addMilestone()">+ {{ isRtl ? 'إضافة عنصر' : 'Add Item' }}</button>

      <!-- Dynamic Deliverables -->
      <div class="nested-block-section" *ngFor="let item of deliverables; let i = index">
        <div class="block-header">
          <span>{{ isRtl ? 'المخرج' : 'Deliverable' }} {{ i + 1 }}</span>
          <button class="delete-item-btn" (click)="removeDeliverable(i)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
        </div>
        <div class="form-grid">
          <div class="form-field-group">
            <label>{{ isRtl ? 'اسم المخرج' : 'Deliverable Name' }}</label>
            <input type="text" [(ngModel)]="item.name" [placeholder]="isRtl ? 'اكتب هنا' : 'Write Here'">
          </div>
          <div class="form-field-group">
            <label>{{ isRtl ? 'تاريخ الإنجاز المتوقع' : 'Expected Completion Date' }}</label>
            <input type="date" [(ngModel)]="item.expectedCompletionDate">
          </div>
        </div>
      </div>
      <button class="add-item-btn" (click)="addDeliverable()">+ {{ isRtl ? 'إضافة عنصر' : 'Add Item' }}</button>

      <div class="form-footer-actions">
        <button class="add-new-btn" (click)="savePlan()">+ {{ isRtl ? 'حفظ الخطة' : 'Add User' }}</button>
      </div>
    </div>
  </div>
</div>
